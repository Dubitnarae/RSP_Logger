[plc]
host = "192.168.1.2"
port = 2004
timeout_s = 2.0

[pc]
# TODO(확인필요): PC 고정 IP 미정 — 현장 스위치에 물린 장비와 겹치지 않는 192.168.1.x 주소 확인 (2026-11-14)
# 프로그램이 쓰는 값은 아님. 노트북 랜 어댑터에 직접 설정할 주소 기록용.
ip = "192.168.1.50"

[poll]
interval_s = 1.0  # 0.1 미만 금지 (CLAUDE.md 규칙 4)

[process]
# TODO(확인필요): 휠 지름(mm) — 0이면 선속도를 계산하지 않고 "—" 표시
wheel_diameter_mm = 0

[record]
# 저장 폴더. 비워 두면 프로젝트 폴더의 data (개발 모드는 data_dev)
dir = ""

[ejection]
pre_s = 10            # 출탕 시작 전 함께 저장할 시간
post_s = 30           # 출탕 종료 후 함께 저장할 시간
fast_interval_s = 0.2 # Run 기록 중 읽기 간격 (0.1 미만 금지)
